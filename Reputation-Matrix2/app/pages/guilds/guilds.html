<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilds & Charters — Waluipedia</title>
    <script>
        /* Follow the encyclopedia's light/dark setting before first paint. */
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('waluipedia-theme') || 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        })();
    </script>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/layout.css">
    <link rel="stylesheet" href="../../styles/components.css">
    <link rel="stylesheet" href="guilds.css">
    <link rel="stylesheet" href="guilds-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="wp-guilds">
    <header class="wp-topbar">
        <a class="wp-brand" href="../../../../index.html#/home"><span class="wp-brand-mark">W</span>Waluipedia</a>
        <span class="wp-crumb">/ Guilds &amp; Charters</span>
        <span class="wp-spacer"></span>
        <button type="button" id="wp-theme-toggle" title="Switch light / dark">◐ Theme</button>
    </header>
    <div class="tablet-frame">
        <div class="scanline-overlay"></div>
        <div id="app">
            <main id="main-content">
                <!-- Rendered by guilds.js -->
            </main>
        </div>
    </div>

    <!-- Guild Detail Modal -->
    <div id="guild-modal" class="modal" style="display: none;">
        <div class="modal-content guild-modal-content">
            <button class="modal-close guild-modal-close">&times;</button>
            <div id="guild-modal-body">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <script>
        document.getElementById('wp-theme-toggle').addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('waluipedia-theme', next); } catch (e) {}
        });
    </script>
    <script type="module" src="../../core/common.js"></script>
    <script type="module" src="../navigation/navigation.js"></script>
    <script type="module" src="guilds.js"></script>
    <script defer src="../../core/wario-site-sounds.js"></script>
    <script defer src="../../styles/waluipedia-ambient.js"></script>
</body>
</html>
